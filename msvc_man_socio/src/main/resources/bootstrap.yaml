spring:
  application:
    name: msvc_man_socio
  cloud:
    config:
      uri: ${CONFIG_SERVER_CONF_URI:http://localhost:9000}
      profile: ${CONFIG_SERVER_PROFILE:dev}
      enabled: true
  data:
    mongodb:
      uri: ${BD_MONGO_URL:mongodb://localhost:27017/erp_db}

server:
  port: ${PORT_MAN_SOCIO:8092}

logging:
  level:
    root: INFO
    com.irojas.microservices: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/msvc-man-socio.log